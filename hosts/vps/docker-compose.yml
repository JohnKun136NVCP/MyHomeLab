# ======================================================================
#  VPS — métricas para Grafana (+ VPN wg-easy opcional)
#
#  Si YA tienes un túnel WireGuard entre la Pi y el VPS (p. ej. wg-hoshimy):
#    VPN_VPS_IP=<IP del VPS en ese túnel> en .env  y solo:
#    docker compose -f hosts/vps/docker-compose.yml --env-file .env up -d
#  Para crear además una VPN con web y QR para teléfono/laptop (wg-easy):
#    docker compose -f hosts/vps/docker-compose.yml --env-file .env --profile wg-easy up -d
# ======================================================================
name: homelab-vps

services:
  wg-easy:
    profiles: ["wg-easy"]
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    network_mode: host          # wg0 queda en el host: node-exporter puede escuchar en 10.8.0.1
    cap_add: [NET_ADMIN, SYS_MODULE]
    environment:
      WG_HOST: ${WG_HOST}
      PASSWORD_HASH: ${WG_PASSWORD_HASH}
      WG_DEFAULT_ADDRESS: 10.8.0.x
      WG_DEFAULT_DNS: 1.1.1.1
      # Solo la red de la VPN pasa por el túnel (tu internet normal no se desvía).
      # Para llegar también a 192.168.0.0/24 de casa ver docs/vpn.md.
      WG_ALLOWED_IPS: 10.8.0.0/24
      WG_PERSISTENT_KEEPALIVE: 25
      UI_TRAFFIC_STATS: "true"
    volumes:
      - wg_data:/etc/wireguard

  node-exporter:
    image: prom/node-exporter:latest
    restart: always
    network_mode: host
    pid: host
    # Solo dentro del túnel: nadie en internet ve tus métricas.
    # Si el túnel aún no está arriba falla y Docker lo reintenta solo.
    command: ["--path.rootfs=/host", "--web.listen-address=${VPN_VPS_IP:-10.8.0.1}:9100"]
    volumes: ["/:/host:ro,rslave"]

volumes:
  wg_data:
