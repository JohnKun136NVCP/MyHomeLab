# ======================================================================
#  VPS — VPN WireGuard (centro de la red) + métricas para Grafana
#    docker compose -f hosts/vps/docker-compose.yml --env-file .env up -d
#
#  El VPS es el «punto de reunión»: tu Pi, tu PC, tu laptop y tu teléfono se
#  conectan a él, así llegas a casa aunque tu internet tenga CGNAT (Telmex/Izzi
#  suelen tenerlo) y Prometheus en la Pi lee las métricas del VPS por el túnel.
# ======================================================================
name: homelab-vps

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    network_mode: host          # wg0 queda en el host: node-exporter puede escuchar en 10.8.0.1
    cap_add: [NET_ADMIN, SYS_MODULE]
    environment:
      WG_HOST: ${WG_HOST}
      PASSWORD_HASH: ${WG_PASSWORD_HASH}
      WG_DEFAULT_ADDRESS: 10.8.0.x
      WG_DEFAULT_DNS: 1.1.1.1
      # Solo la red de la VPN pasa por el túnel (tu internet normal no se desvía).
      # Para llegar también a 192.168.0.0/24 de casa ver docs/vpn.md.
      WG_ALLOWED_IPS: 10.8.0.0/24
      WG_PERSISTENT_KEEPALIVE: 25
      UI_TRAFFIC_STATS: "true"
    volumes:
      - wg_data:/etc/wireguard

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    network_mode: host
    pid: host
    # Solo dentro de la VPN: nadie en internet ve tus métricas
    command: ["--path.rootfs=/host", "--web.listen-address=10.8.0.1:9100"]
    volumes: ["/:/host:ro,rslave"]

volumes:
  wg_data:
