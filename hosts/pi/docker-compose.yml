# ======================================================================
#  Raspberry Pi 4 — red, monitoreo, alertas, bot y web
#  Uso (desde la raíz del repo):
#    docker compose -f hosts/pi/docker-compose.yml --env-file .env up -d
#    ... --profile ids up -d        # Suricata (IDS), recomendado en modo puente
#    ... --profile dns up -d        # AdGuard Home (DNS de la casa)
#    ... --profile servicios up -d  # Uptime Kuma y Vaultwarden
#  Varios a la vez:  --profile dns --profile servicios
# ======================================================================
name: homelab-pi

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # --- Web de entrada (HTTPS local + contraseña) -------------------------
  caddy:
    <<: *common
    image: caddy:2-alpine
    # Si nginx u otro programa ya usa 80/443 en la Pi, cambia HTTP_PORT/HTTPS_PORT en .env
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      HOMELAB_HOST: ${HOMELAB_HOST}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      WEB_USER: ${WEB_USER:-admin}
      WEB_PASSWORD_HASH: ${WEB_PASSWORD_HASH}
      SSO_DOMAIN: ${SSO_DOMAIN:-}
      SSO_SECRET: ${SSO_SECRET:-}
    volumes:
      - ../../config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../config/caddy/sso:/etc/caddy/sso:ro
      - caddy_data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [grafana, bot]

  # --- Escaneo de red, anomalías, ACL, métricas y app web -----------------
  netwatch:
    <<: *common
    build: { context: ../../services, dockerfile: netwatch/Dockerfile }
    network_mode: host            # necesita ver la red real para ARP/nmap/nftables
    cap_add: [NET_RAW, NET_ADMIN]
    env_file: ../../.env
    environment:
      HOMELAB_CONFIG: /homelab/config/homelab.yml
      HOMELAB_ENV: /homelab/.env
      HOMELAB_RUN: /homelab/run
      DATA_DIR: /data
      UFW_LOG: /hostlog/ufw.log
      ADGUARD_USER: ${ADGUARD_USER:-}
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:-}
      PROMETHEUS_URL: http://127.0.0.1:9090/prometheus
      BOT_URL: http://127.0.0.1:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # docker0: la alcanzan Caddy y Prometheus, pero no el resto de la red
      LISTEN: 172.17.0.1:8000
      SURICATA_EVE: /suricata/eve.json
    volumes:
      # Ajustes de la web: lee y escribe estos archivos (copias en run/)
      - ../../config:/homelab/config
      - ../../.env:/homelab/.env
      - ../../run:/homelab/run
      - ../../clients:/homelab/clients:ro    # instaladores de «Mis respaldos»
      - ../../hosts/home:/homelab/home:ro     # qué herramientas de la casa están encendidas
      - netwatch_data:/data
      - prom_targets:/data/prom-targets
      - suricata_logs:/suricata:ro
      - /var/log:/hostlog:ro         # log de UFW (intentos bloqueados)
      # nmcli del contenedor habla con el NetworkManager de la Pi (cambiar de SSID)
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

  # --- Bot de Telegram + receptor de respaldos + alertas -----------------
  bot:
    <<: *common
    build: { context: ../../services, dockerfile: bot/Dockerfile }
    ports: ["127.0.0.1:8080:8080"]
    env_file: ../../.env          # incluye los BACKUP_TOKEN_* de todos tus equipos
    environment:
      HOMELAB_CONFIG: /config/homelab.yml
      DATA_DIR: /data
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      PROMETHEUS_URL: http://prometheus:9090/prometheus
      NETWATCH_URL: http://host.docker.internal:8000
      META_PAGE_TOKEN: ${META_PAGE_TOKEN:-}
    volumes:
      - ../../config/homelab.yml:/config/homelab.yml:ro
      - bot_data:/data
      - ${BACKUPS_DIR:-./backups}:/data/backups
      # archivos que el servidor Bot API local guarda (misma ruta que en el host);
      # escritura para borrarlos una vez copiados y no llenar el disco
      - ${TELEGRAM_API_DATA:-/var/lib/telegram-bot-api}:${TELEGRAM_API_DATA:-/var/lib/telegram-bot-api}
    extra_hosts: ["host.docker.internal:host-gateway"]

  # --- Métricas ----------------------------------------------------------
  # Servidor local de la Bot API (archivos de hasta 2 GB). En la Raspberry ya tienes el tuyo
  # (fuera de Docker); en una máquina nueva activa el perfil «botapi» (lo hace scripts/migrate.sh)
  # y pon TELEGRAM_API_URL=http://telegram-bot-api:8081 en .env.
  telegram-bot-api:
    <<: *common
    profiles: ["botapi"]
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_LOCAL: "1"
    volumes:
      - ${TELEGRAM_API_DATA:-/var/lib/telegram-bot-api}:/var/lib/telegram-bot-api

  prometheus:
    <<: *common
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.external-url=/prometheus/
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]   # netwatch (red del host) la consulta aquí
    volumes:
      - ../../config/prometheus:/etc/prometheus:ro
      - prom_data:/prometheus
      - prom_targets:/prometheus-targets:ro   # fuera de /etc/prometheus (que es de solo lectura)
    extra_hosts: ["host.docker.internal:host-gateway"]

  alertmanager:
    <<: *common
    image: prom/alertmanager:latest
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../../config/alertmanager:/etc/alertmanager:ro

  grafana:
    <<: *common
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${HOMELAB_HOST}:${HTTPS_PORT:-443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Inicio de sesión único: Caddy pone el usuario que validó Authelia (solo por panel.casa.lan)
      GF_AUTH_PROXY_ENABLED: ${SSO_GRAFANA:-false}
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: ${SSO_GRAFANA_ROLE:-Viewer}
    volumes:
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  node-exporter:
    <<: *common
    image: prom/node-exporter:latest
    # Sin las interfaces virtuales de Docker (vethXXXX, br-XXXX, docker0) en las métricas
    command: ["--path.rootfs=/host", "--web.listen-address=:9100",
              "--collector.netdev.device-exclude=^(veth.*|br-.*|docker[0-9]+|lo)$"]
    network_mode: host
    pid: host
    volumes: ["/:/host:ro,rslave"]

  # --- IDS (opcional): docker compose ... --profile ids up -d -------------
  suricata:
    <<: *common
    profiles: ["ids"]
    image: jasonish/suricata:latest
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    environment:
      # Varias interfaces separadas por espacio: «eth0 wlan0» (casa y laboratorio)
      CAPTURE_INTERFACES: ${CAPTURE_INTERFACES:-${CAPTURE_INTERFACE:-eth0}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        args="";
        for i in $$CAPTURE_INTERFACES; do
          if [ -e "/sys/class/net/$$i" ]; then args="$$args -i $$i"; else echo "⚠ no existe la interfaz $$i"; fi;
        done;
        [ -n "$$args" ] || args="-i eth0";
        echo "Suricata escuchando en:$$args";
        exec /docker-entrypoint.sh $$args
    volumes:
      - suricata_logs:/var/log/suricata
      - suricata_rules:/var/lib/suricata

  # --- DNS de la casa (opcional): --profile dns -----------------------------
  adguard:
    <<: *common
    profiles: ["dns"]
    image: adguard/adguardhome:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3002:3000/tcp"      # web de AdGuard: http://IP-de-la-Pi:3002
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

  # --- Servicios (opcional): --profile servicios ------------------------------
  uptime-kuma:
    <<: *common
    profiles: ["servicios"]
    # v2 (la v1 ya no recibe parches). «2-slim» = sin Chromium ni MariaDB integrados: ideal en la Pi
    image: louislam/uptime-kuma:2-slim
    ports: ["3001:3001"]            # http://IP-de-la-Pi:3001
    volumes:
      - uptime_kuma:/app/data
    # para monitorear servicios de la propia Pi (Bot API, nginx…): host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]

  vaultwarden:
    <<: *common
    profiles: ["servicios"]
    image: vaultwarden/server:latest
    environment:
      # Se usa por https://IP:PUERTO/vault (Caddy le pone el certificado)
      DOMAIN: https://${HOMELAB_HOST}:${HTTPS_PORT:-443}/vault
      SIGNUPS_ALLOWED: ${VW_SIGNUPS_ALLOWED:-true}   # pon false en .env después de crear tu cuenta
      # Con registros cerrados, la familia entra por invitación (/vault/admin → Invite User):
      # sin correo configurado, la persona invitada se registra en /vault con ese mismo email.
      INVITATIONS_ALLOWED: "true"
      INVITATION_ORG_NAME: "MyHomeLab"
      SHOW_PASSWORD_HINT: "false"
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN:-}
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ${VW_DATA:-./vaultwarden}:/data

  # --- Velocidad del internet (opcional): --profile speedtest ---------------
  # http://IP-de-la-Pi:8765 · prueba cada 6 h; la Pi va por cable al módem: mide lo real
  speedtest:
    <<: *common
    profiles: ["speedtest"]
    image: lscr.io/linuxserver/speedtest-tracker:latest
    ports: ["8765:80"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-America/Mexico_City}
      DISPLAY_TIMEZONE: ${TZ:-America/Mexico_City}
      APP_KEY: ${SPEEDTEST_APP_KEY:-}
      # Usuario de la web (solo cuenta la primera vez que arranca; luego cámbialo en su Perfil)
      ADMIN_NAME: Admin
      ADMIN_EMAIL: ${SPEEDTEST_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${SPEEDTEST_ADMIN_PASSWORD:-password}
      APP_URL: http://${HOMELAB_HOST}:8765
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: ${SPEEDTEST_SCHEDULE:-17 */6 * * *}
      PRUNE_RESULTS_OLDER_THAN: "365"
    volumes:
      - speedtest:/config

  # --- Tráfico de la red por equipo y protocolo (opcional): --profile ntopng --
  # http://IP-de-la-Pi:3005 (la primera vez admin/admin y te pide cambiarla)
  ntopng:
    <<: *common
    profiles: ["ntopng"]
    image: ntop/ntopng:stable
    network_mode: host
    command: ["-i", "${NTOPNG_IFACE:-eth0}", "-w", "3005", "-r", "127.0.0.1:6380", "--community"]
    depends_on: [ntopng-redis]
  ntopng-redis:
    <<: *common
    profiles: ["ntopng"]
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]

  # --- Avisos de imágenes nuevas (opcional): --profile diun -----------------
  # Revisa cada día si hay versión nueva de las imágenes que usas y te avisa (sin sonido).
  # No actualiza nada: tú decides cuándo con ./hl update o ./hl pull.
  diun:
    <<: *common
    profiles: ["diun"]
    image: crazymax/diun:4
    command: serve
    environment:
      TZ: ${TZ:-America/Mexico_City}
      DIUN_WATCH_SCHEDULE: ${DIUN_SCHEDULE:-0 10 * * *}
      DIUN_WATCH_JITTER: 30m
      DIUN_WATCH_FIRSTCHECKNOTIF: "false"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_NOTIF_WEBHOOK_ENDPOINT: http://bot:8080/notify
      DIUN_NOTIF_WEBHOOK_METHOD: POST
      DIUN_NOTIF_WEBHOOK_HEADERS_CONTENT-TYPE: application/json
      DIUN_NOTIF_WEBHOOK_HEADERS_AUTHORIZATION: Bearer ${INTERNAL_TOKEN}
      DIUN_NOTIF_WEBHOOK_TIMEOUT: 10s
    volumes:
      - diun:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [bot]

  # --- Inicio de sesión único (opcional): ./scripts/sso.sh -------------
  authelia:
    <<: *common
    profiles: ["sso"]
    image: authelia/authelia:4.39
    environment:
      TZ: ${TZ:-America/Mexico_City}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET:-}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:-}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_KEY:-}
    volumes:
      # configuration.yml lo genera sso.sh; users.yml lo escribe el panel
      - ../../config/authelia:/config

volumes:
  caddy_data:
  netwatch_data:
  bot_data:
  prom_data:
  prom_targets:
  grafana_data:
  suricata_logs:
  suricata_rules:
  adguard_work:
  adguard_conf:
  uptime_kuma:
  speedtest:
  diun:
