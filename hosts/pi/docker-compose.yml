# ======================================================================
#  Raspberry Pi 4 — red, monitoreo, alertas, bot y web
#  Uso (desde la raíz del repo):
#    docker compose -f hosts/pi/docker-compose.yml --env-file .env up -d
#    ... --profile ids up -d        # Suricata (IDS), recomendado en modo puente
#    ... --profile dns up -d        # AdGuard Home (DNS de la casa)
#    ... --profile servicios up -d  # Uptime Kuma y Vaultwarden
#  Varios a la vez:  --profile dns --profile servicios
# ======================================================================
name: homelab-pi

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  # --- Web de entrada (HTTPS local + contraseña) -------------------------
  caddy:
    <<: *common
    image: caddy:2-alpine
    # Si nginx u otro programa ya usa 80/443 en la Pi, cambia HTTP_PORT/HTTPS_PORT en .env
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      HOMELAB_HOST: ${HOMELAB_HOST}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      WEB_USER: ${WEB_USER:-admin}
      WEB_PASSWORD_HASH: ${WEB_PASSWORD_HASH}
    volumes:
      - ../../config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [grafana, bot]

  # --- Escaneo de red, anomalías, ACL, métricas y app web -----------------
  netwatch:
    <<: *common
    build: { context: ../../services, dockerfile: netwatch/Dockerfile }
    network_mode: host            # necesita ver la red real para ARP/nmap/nftables
    cap_add: [NET_RAW, NET_ADMIN]
    env_file: ../../.env
    environment:
      HOMELAB_CONFIG: /homelab/config/homelab.yml
      HOMELAB_ENV: /homelab/.env
      HOMELAB_RUN: /homelab/run
      DATA_DIR: /data
      UFW_LOG: /hostlog/ufw.log
      ADGUARD_USER: ${ADGUARD_USER:-}
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:-}
      PROMETHEUS_URL: http://127.0.0.1:9090/prometheus
      BOT_URL: http://127.0.0.1:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # docker0: la alcanzan Caddy y Prometheus, pero no el resto de la red
      LISTEN: 172.17.0.1:8000
      SURICATA_EVE: /suricata/eve.json
    volumes:
      # Ajustes de la web: lee y escribe estos archivos (copias en run/)
      - ../../config:/homelab/config
      - ../../.env:/homelab/.env
      - ../../run:/homelab/run
      - netwatch_data:/data
      - prom_targets:/data/prom-targets
      - suricata_logs:/suricata:ro
      - /var/log:/hostlog:ro         # log de UFW (intentos bloqueados)
      # nmcli del contenedor habla con el NetworkManager de la Pi (cambiar de SSID)
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket

  # --- Bot de Telegram + receptor de respaldos + alertas -----------------
  bot:
    <<: *common
    build: { context: ../../services, dockerfile: bot/Dockerfile }
    ports: ["127.0.0.1:8080:8080"]
    env_file: ../../.env          # incluye los BACKUP_TOKEN_* de todos tus equipos
    environment:
      HOMELAB_CONFIG: /config/homelab.yml
      DATA_DIR: /data
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS}
      TELEGRAM_API_URL: ${TELEGRAM_API_URL:-https://api.telegram.org}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      PROMETHEUS_URL: http://prometheus:9090/prometheus
      NETWATCH_URL: http://host.docker.internal:8000
      META_PAGE_TOKEN: ${META_PAGE_TOKEN:-}
    volumes:
      - ../../config/homelab.yml:/config/homelab.yml:ro
      - bot_data:/data
      - ${BACKUPS_DIR:-./backups}:/data/backups
      # archivos que el servidor Bot API local guarda (misma ruta que en el host)
      - ${TELEGRAM_API_DATA:-/var/lib/telegram-bot-api}:${TELEGRAM_API_DATA:-/var/lib/telegram-bot-api}:ro
    extra_hosts: ["host.docker.internal:host-gateway"]

  # --- Métricas ----------------------------------------------------------
  prometheus:
    <<: *common
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.external-url=/prometheus/
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]   # netwatch (red del host) la consulta aquí
    volumes:
      - ../../config/prometheus:/etc/prometheus:ro
      - prom_data:/prometheus
      - prom_targets:/prometheus-targets:ro   # fuera de /etc/prometheus (que es de solo lectura)
    extra_hosts: ["host.docker.internal:host-gateway"]

  alertmanager:
    <<: *common
    image: prom/alertmanager:latest
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../../config/alertmanager:/etc/alertmanager:ro

  grafana:
    <<: *common
    image: grafana/grafana-oss:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${HOMELAB_HOST}:${HTTPS_PORT:-443}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../../config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

  node-exporter:
    <<: *common
    image: prom/node-exporter:latest
    command: ["--path.rootfs=/host", "--web.listen-address=:9100"]
    network_mode: host
    pid: host
    volumes: ["/:/host:ro,rslave"]

  # --- IDS (opcional): docker compose ... --profile ids up -d -------------
  suricata:
    <<: *common
    profiles: ["ids"]
    image: jasonish/suricata:latest
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: ["-i", "${CAPTURE_INTERFACE:-eth0}"]
    volumes:
      - suricata_logs:/var/log/suricata
      - suricata_rules:/var/lib/suricata

  # --- DNS de la casa (opcional): --profile dns -----------------------------
  adguard:
    <<: *common
    profiles: ["dns"]
    image: adguard/adguardhome:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3002:3000/tcp"      # web de AdGuard: http://IP-de-la-Pi:3002
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf

  # --- Servicios (opcional): --profile servicios ------------------------------
  uptime-kuma:
    <<: *common
    profiles: ["servicios"]
    image: louislam/uptime-kuma:1
    ports: ["3001:3001"]            # http://IP-de-la-Pi:3001
    volumes:
      - uptime_kuma:/app/data

  vaultwarden:
    <<: *common
    profiles: ["servicios"]
    image: vaultwarden/server:latest
    environment:
      # Se usa por https://IP:PUERTO/vault (Caddy le pone el certificado)
      DOMAIN: https://${HOMELAB_HOST}:${HTTPS_PORT:-443}/vault
      SIGNUPS_ALLOWED: ${VW_SIGNUPS_ALLOWED:-true}   # pon false en .env después de crear tu cuenta
      ADMIN_TOKEN: ${VW_ADMIN_TOKEN:-}
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ${VW_DATA:-./vaultwarden}:/data

volumes:
  caddy_data:
  netwatch_data:
  bot_data:
  prom_data:
  prom_targets:
  grafana_data:
  suricata_logs:
  suricata_rules:
  adguard_work:
  adguard_conf:
  uptime_kuma:
