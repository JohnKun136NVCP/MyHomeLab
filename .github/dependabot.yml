# Dependabot: abre un pull request cuando hay versión nueva (o un parche de seguridad) de lo
# que usa el homelab. Activa también Settings → Code security → Dependabot alerts.
version: 2
updates:
  # Paquetes de Python del panel y del bot
  - package-ecosystem: "pip"
    directories: ["/services/netwatch", "/services/bot", "/clients/linux-guardian"]
    schedule: { interval: "weekly", day: "saturday" }
    groups:
      python: { patterns: ["*"] }

  # Imagen base (python:3.12-slim) de sus Dockerfiles
  - package-ecosystem: "docker"
    directories: ["/services/netwatch", "/services/bot"]
    schedule: { interval: "weekly", day: "saturday" }

  # Imágenes con versión fija en los docker-compose (authelia:4.39, diun:4, frr:10.2.1…);
  # las que usan :latest las avisa Diun y las baja ./hl update --all
  - package-ecosystem: "docker-compose"
    directories: ["/hosts/pi", "/hosts/home", "/hosts/server", "/lab/security"]
    schedule: { interval: "weekly", day: "saturday" }
