# ======================================================================
#  MyHomeLab — configuración principal (sin secretos; esos van en .env)
#  Copia este archivo a config/homelab.yml y ajústalo.
# ======================================================================

network:
  interface: wlan0              # la Wi-Fi de la Pi (eth0 si va por cable)
  scan_interval: 120            # segundos entre escaneos de la red donde está la Pi
  port_scan_new_devices: true   # nmap -F a cada dispositivo nuevo (para saber qué es)
  daily_port_scan: "03:30"      # re-escaneo de puertos (detecta servicios nuevos)

  # Tus segmentos. Cada uno es un SSID con un perfil guardado en NetworkManager:
  #   sudo nmcli dev wifi connect "SSID" password "clave"   (una vez por red)
  networks:
    - name: casa
      ssid: "INFINITUM_XXXX"    # Wi-Fi del módem (red de la familia)
      cidr: 192.168.20.0/24
    - name: laboratorio
      ssid: "Tenda_LAB"         # Wi-Fi del Tenda (tu laboratorio)
      cidr: 192.168.200.0/24
      notify_new_devices: false # en el lab conectas y desconectas cosas seguido

  # La Pi vive en «casa» y cada hop_every segundos visita las demás redes,
  # las escanea y regresa (~30-60 s fuera). Ver docs/redes-multiples.md
  roaming:
    enabled: true
    home: casa
    hop_every: 1800

  # Modo puente (solo con cable y una sola red): la Pi entre el módem y los AP.
  # Ver docs/modo-puente.md. Incompatible con roaming.
  bridge_mode: false
  bridge_interface: br0

# Infraestructura: aparece en el mapa, en «Accesos» (un clic) y se monitorea con ping
infrastructure:
  modem:
    name: Módem
    ip: 192.168.20.1
    admin_url: http://192.168.20.1
  access_points:
    # Router de otra red: «network» dice de qué red es, «ip» su IP en esa red y
    # «wan_ip» la IP que le dio el módem (desde casa se le hace ping por ahí).
    - name: Tenda Lab
      network: laboratorio
      ip: 192.168.200.1
      wan_ip: 192.168.20.2
      admin_url: http://192.168.200.1
      model: Tenda
      location: Laboratorio
    # Un AP en modo AP dentro de la red de casa no lleva «network»:
    # - name: AP Sala
    #   ip: 192.168.20.3
    #   admin_url: http://192.168.20.3
    #   model: Tenda
  # Nodos con node-exporter (los scrapea Prometheus)
  nodes:
    - name: raspberry
      target: host.docker.internal:9100
    # - name: servidor
    #   target: 192.168.20.10:9100
    # - name: vps
    #   target: 10.8.0.1:9100        # IP del VPS dentro de la VPN WireGuard
  ping_targets:
    - name: internet
      host: 1.1.1.1
    - name: dns-google
      host: 8.8.8.8

# Accesos de un clic en la web (además de módem y AP)
links:
  - name: Grafana
    url: /grafana/
    icon: 📊
  - name: Frigate (cámaras)
    url: http://192.168.20.10:5000
    icon: 🎥
  - name: Jellyfin (streaming)
    url: http://192.168.20.10:8096
    icon: 🎬
  - name: VPN (wg-easy)
    url: http://10.8.0.1:51821
    icon: 🔐
  - name: Prometheus
    url: /prometheus/
    icon: 🔥

cameras:
  frigate_url: http://192.168.20.10:5000     # Frigate en la PC Linux
  go2rtc_url: http://192.168.20.10:1984      # vista en vivo (WebRTC/MSE)
  notify_labels: [person, car]              # el bot avisa con foto cuando detecta esto
  notify_cooldown: 300                      # segundos entre avisos de la misma cámara

anomalies:
  notify_new_devices: true
  quarantine_unknown: false     # true = bloquea en automático lo desconocido (solo modo puente)
  quiet_hours: ["01:00", "07:00"]  # avisos no urgentes se juntan para el reporte diario

reports:
  daily_time: "09:00"
  timezone: America/Mexico_City

backups:
  dir: /data/backups
  keep_per_device: 5            # cuántos respaldos guardar por dispositivo
  forward_to_telegram: true     # reenviarte cada respaldo al chat (máx. ~1.9 GB por archivo)
  # Dispositivos que pueden subir respaldos. El token de cada uno va en .env
  # como BACKUP_TOKEN_<NOMBRE en mayúsculas>, ej. BACKUP_TOKEN_LAPTOP_WIN
  devices:
    - name: laptop-linux
      os: linux
    - name: laptop-win
      os: windows
    - name: macbook
      os: macos
    - name: telefono
      os: android

social:
  timezone: America/Mexico_City
  facebook_page_id: ""          # ID numérico de la página de tu empresa
  instagram_user_id: ""         # ID de la cuenta Business ligada a esa página
  telegram_channel: ""          # @tu_canal o -100xxxxxxxxxx (el bot debe ser admin)
