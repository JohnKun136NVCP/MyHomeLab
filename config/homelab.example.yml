# ======================================================================
#  MyHomeLab — configuración principal (sin secretos; esos van en .env)
#  Copia este archivo a config/homelab.yml y ajústalo.
# ======================================================================

network:
  scan_interval: 120            # segundos entre escaneos
  port_scan_new_devices: true   # nmap -F a cada dispositivo nuevo (para saber qué es)
  daily_port_scan: "03:30"      # re-escaneo de puertos (detecta servicios nuevos)

  # Redes que la Pi ve DIRECTO, cada una por su interfaz (se escanean todas cada ciclo).
  # La de oficinas (Tenda 2) no va aquí: la Pi no tiene interfaz dentro de ella;
  # se ve como el router «Tenda Oficinas» por su IP WAN (ver access_points).
  networks:
    - name: casa
      interface: eth0           # cable al módem
      cidr: 192.168.1.0/24
    - name: laboratorio
      interface: wlan0          # Wi-Fi del Tenda 1
      cidr: 192.168.100.0/24
      notify_new_devices: false # en el lab conectas y desconectas cosas seguido

  # Con UNA sola Wi-Fi para varias redes: enabled: true y cada red con su ssid
  # (ver docs/redes-multiples.md). Con una interfaz por red, déjalo en false.
  roaming:
    enabled: false
    home: casa

  # Modo puente (cable, una sola red): la Pi entre el módem y los AP. docs/modo-puente.md
  bridge_mode: false
  bridge_interface: br0

# Infraestructura: aparece en el mapa, en «Accesos» (un clic) y se monitorea con ping
infrastructure:
  modem:
    name: Módem
    ip: 192.168.1.1
    admin_url: http://192.168.1.1
  access_points:
    # Router de otra red: «network» = su red, «ip» = su IP en esa red,
    # «wan_ip» = la IP que le dio el módem (si la Pi no está en su red, se le hace ping por ahí)
    - name: Tenda Lab
      network: laboratorio
      ip: 192.168.100.1
      wan_ip: 192.168.1.2
      admin_url: http://192.168.100.1
      model: Tenda
      location: Laboratorio
    - name: Tenda Oficinas
      network: oficinas
      ip: 192.168.2.1
      wan_ip: 192.168.1.3
      admin_url: http://192.168.2.1   # solo abre desde la red de oficinas
      model: Tenda
      location: Oficinas y cuartos
  # Nodos con node-exporter (los scrapea Prometheus)
  nodes:
    - name: raspberry
      target: host.docker.internal:9100
    # - name: servidor
    #   target: 192.168.1.10:9100
    # - name: vps
    #   target: 10.66.0.1:9100       # IP del VPS dentro de tu túnel WireGuard (wg-hoshimy)
  # CrowdSec del VPS (métricas por el túnel; ver docs/vpn.md)
  # crowdsec:
  #   - name: vps
  #     target: 10.66.0.1:6060
  ping_targets:
    - name: internet
      host: 1.1.1.1
    - name: dns-google
      host: 8.8.8.8
    # - name: vps
    #   host: 10.66.0.1             # ping al VPS por el túnel

# Accesos de un clic en la web (además de módem y AP)
links:
  - name: Grafana
    url: /grafana/
    icon: 📊
  - name: Frigate (cámaras)
    url: http://192.168.1.10:5000
    icon: 🎥
  - name: Jellyfin (streaming)
    url: http://192.168.1.10:8096
    icon: 🎬
  # - name: VPN (wg-easy)          # solo si usas el perfil wg-easy en el VPS
  #   url: http://10.8.0.1:51821
  #   icon: 🔐
  - name: Prometheus
    url: /prometheus/
    icon: 🔥
  - name: AdGuard (DNS)
    url: http://192.168.1.5:3002
    icon: 🛡
  - name: Uptime Kuma
    url: http://192.168.1.5:3001
    icon: 📈
  - name: Vaultwarden
    url: /vault/
    icon: 🔑

# DNS de la casa (perfil «dns»). netwatch lee sus estadísticas, los nombres de los
# equipos y te avisa si alguien intentó abrir un dominio de malware/phishing.
dns:
  adguard_url: http://127.0.0.1:3002      # vacío = sin AdGuard

# Honeypot (perfil «honeypot»): solo informativo, los puertos están en
# services/honeypot/opencanary.conf.template
honeypot:
  ports: [21, 23, 1433, 2222, 3306, 3389, 5900, 6379]

cameras:
  frigate_url: http://192.168.1.10:5000     # Frigate en la PC Linux
  go2rtc_url: http://192.168.1.10:1984      # vista en vivo (WebRTC/MSE)
  notify_labels: [person, car]              # el bot avisa con foto cuando detecta esto
  notify_cooldown: 300                      # segundos entre avisos de la misma cámara

anomalies:
  notify_new_devices: true
  quarantine_unknown: false     # true = bloquea en automático lo desconocido (solo modo puente)
  quiet_hours: ["01:00", "07:00"]  # avisos no urgentes se juntan para el reporte diario

reports:
  daily_time: "09:00"
  timezone: America/Mexico_City

backups:
  dir: /data/backups
  keep_per_device: 5            # cuántos respaldos guardar por dispositivo
  forward_to_telegram: true     # reenviarte cada respaldo al chat (máx. ~1.9 GB por archivo)
  # Dispositivos que pueden subir respaldos. El token de cada uno va en .env
  # como BACKUP_TOKEN_<NOMBRE en mayúsculas>, ej. BACKUP_TOKEN_LAPTOP_WIN
  devices:
    - name: laptop-linux
      os: linux
    - name: laptop-win
      os: windows
    - name: macbook
      os: macos
    - name: telefono
      os: android

social:
  timezone: America/Mexico_City
  facebook_page_id: ""          # ID numérico de la página de tu empresa
  instagram_user_id: ""         # ID de la cuenta Business ligada a esa página
  telegram_channel: ""          # @tu_canal o -100xxxxxxxxxx (el bot debe ser admin)
