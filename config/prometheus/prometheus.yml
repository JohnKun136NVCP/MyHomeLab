global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  # Raspberry, PC Linux y VPS. La lista sale de config/homelab.yml
  # (netwatch la escribe en targets/nodes.json; no hay que editar esto).
  - job_name: node
    file_sd_configs:
      - files: ["/prometheus-targets/nodes.json"]
        refresh_interval: 1m

  # Dispositivos, latencias, tráfico por dispositivo, eventos e IDS
  - job_name: netwatch
    scrape_interval: 60s
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { instance: raspberry }
