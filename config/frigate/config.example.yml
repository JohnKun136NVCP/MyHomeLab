# Frigate — cámaras Tapo / Imou / EZVIZ por RTSP (ver docs/camaras.md)
# {FRIGATE_RTSP_USER} y {FRIGATE_RTSP_PASSWORD} salen del .env
mqtt:
  enabled: false        # el bot consulta la API de eventos; no hace falta broker

go2rtc:
  streams:
    # --- TP-Link Tapo: stream1 = HD, stream2 = SD (activa «Cuenta de cámara» en la app)
    entrada:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.0.20:554/stream1
    entrada_sd:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.0.20:554/stream2
    # --- Imou (usuario admin + contraseña/código de seguridad de la cámara)
    # patio:
    #   - rtsp://admin:CLAVE@192.168.0.21:554/cam/realmonitor?channel=1&subtype=0
    # --- EZVIZ (usuario admin + código de verificación de 6 letras de la etiqueta)
    # cochera:
    #   - rtsp://admin:CODIGO@192.168.0.22:554/h264/ch1/main/av_stream
    # --- Cámara genérica tipo foco 360° / mini WiFi: depende de su app.
    #     La forma fácil: dashboard → Cámaras → «Detectar cámara genérica» te da este bloque listo.
    # foco_sala:      # app iCSee / XMEye
    #   - rtsp://192.168.1.40:554/user=admin&password={FRIGATE_FOCO_SALA_PASSWORD}&channel=1&stream=0.sdp?real_stream
    # foco_patio:     # app V380 Pro (activa RTSP en la app)
    #   - rtsp://admin:{FRIGATE_FOCO_PATIO_PASSWORD}@192.168.1.41:554/live/ch00_0
    # foco_cuarto:    # app Yoosee
    #   - rtsp://admin:{FRIGATE_FOCO_CUARTO_PASSWORD}@192.168.1.42:554/onvif1

cameras:
  entrada:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/entrada_sd   # detección con la de baja resolución
          input_args: preset-rtsp-restream
          roles: [detect]
        - path: rtsp://127.0.0.1:8554/entrada
          input_args: preset-rtsp-restream
          roles: [record]
    detect:
      width: 640
      height: 360
      fps: 5
    objects:
      track: [person, car, dog, cat]

record:
  enabled: true
  retain:
    days: 3
    mode: motion
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14

snapshots:
  enabled: true
  retain:
    default: 14

# CPU por defecto. En una PC Intel cambia a:  detectors: { ov: { type: openvino, device: GPU } }
detectors:
  cpu1:
    type: cpu
