# «Cine en casa» (services/cine) + Jellyfin detrás del mismo puerto:
#   http://IP-de-la-PC:8097          → el portal
#   http://IP-de-la-PC:8097/jellyfin → Jellyfin (así el navegador no choca con CORS)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # El portal: sin caché larga para que las actualizaciones se vean al recargar
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location /jellyfin/ {
        proxy_pass http://jellyfin:8096/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # video: que fluya sin juntarlo en memoria ni cortarlo
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
