<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>MyHomeLab</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡</text></svg>">
</head>
<body>
<div class="topbar">
  <button id="menu" class="icon-btn" aria-label="Menú" aria-controls="side" aria-expanded="false">☰</button>
  <b class="topbar-title" id="title">MyHomeLab</b>
  <span id="mode-m" class="pill"></span>
</div>
<div id="scrim" hidden></div>
<aside id="side">
  <div class="brand">🛡 <b>MyHomeLab</b><span id="mode" class="pill"></span></div>
  <nav id="tabs">
    <div class="nav-group" data-logs>Red</div>
    <a href="#inicio"><i>🏠</i>Inicio</a>
    <a href="#resumen" data-logs><i>📊</i>Resumen</a>
    <a href="#dispositivos" data-logs><i>💻</i>Dispositivos</a>
    <a href="#trafico" data-logs><i>📈</i>Tráfico</a>
    <a href="#conexiones" data-logs><i>🔌</i>Conexiones</a>
    <a href="#ap" data-logs><i>📡</i>Por AP</a>
    <a href="#mapa" data-logs><i>🗺</i>Mapa</a>
    <a href="#wifi" data-logs><i>📶</i>Wi-Fi</a>
    <div class="nav-group">Casa</div>
    <a href="#respaldos"><i>📦</i>Mis respaldos<span class="badge" id="unread" hidden></span></a>
    <a href="#camaras"><i>📷</i>Cámaras</a>
    <a href="#servicios"><i>🧩</i>Servicios</a>
    <a href="#accesos"><i>🔗</i>Accesos</a>
    <div class="nav-group" data-logs>Seguridad</div>
    <a href="#eventos" data-logs><i>🔔</i>Eventos</a>
    <a href="#acl" data-admin><i>⛔</i>ACL</a>
    <a href="#vpn" data-admin><i>🔐</i>VPN</a>
    <a href="#inventario" data-logs><i>🧬</i>Inventario</a>
    <a href="#parental" data-admin><i>🛡</i>Control parental</a>
    <div class="nav-group" data-admin>Administración</div>
    <a href="#bots" data-admin><i>🤖</i>Bots</a>
    <a href="#contrasenas" data-admin><i>🔑</i>Contraseñas</a>
    <a href="#sistema" data-admin><i>🛠</i>Sistema</a>
    <a href="#cuentas" data-admin><i>👥</i>Cuentas</a>
    <a href="#ajustes" data-admin><i>⚙</i>Ajustes</a>
  </nav>
  <div class="side-foot">
    <a href="#cuenta" class="me"><span class="avatar" id="avatar">?</span><span><b id="me">…</b><br><span class="muted small" id="role"></span></span></a>
    <form method="post" action="/auth/logout"><button type="submit" class="icon-btn" title="Cerrar sesión">⎋</button></form>
  </div>
</aside>
<main id="view"></main>
<div id="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
