# Laboratorio CCNA: OSPF de área 0 entre 3 routers FRR + 2 PCs.
#   sudo containerlab deploy -t lab/ospf/ospf.clab.yml
#   sudo containerlab destroy -t lab/ospf/ospf.clab.yml --cleanup
#
#        PC1 (192.168.10.10)               PC2 (192.168.30.10)
#         │                                   │
#        R1 ── 10.0.12.0/30 ── R2 ── 10.0.23.0/30 ── R3
#         └──────────── 10.0.13.0/30 ─────────────┘
name: ospf

topology:
  defaults:
    kind: linux
  nodes:
    r1:
      image: quay.io/frrouting/frr:10.2.1
      binds: [configs/daemons:/etc/frr/daemons, configs/r1.conf:/etc/frr/frr.conf]
    r2:
      image: quay.io/frrouting/frr:10.2.1
      binds: [configs/daemons:/etc/frr/daemons, configs/r2.conf:/etc/frr/frr.conf]
    r3:
      image: quay.io/frrouting/frr:10.2.1
      binds: [configs/daemons:/etc/frr/daemons, configs/r3.conf:/etc/frr/frr.conf]
    pc1:
      image: alpine:3.20
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1
    pc2:
      image: alpine:3.20
      exec:
        - ip addr add 192.168.30.10/24 dev eth1
        - ip route replace default via 192.168.30.1
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
    - endpoints: ["r1:eth3", "pc1:eth1"]
    - endpoints: ["r3:eth3", "pc2:eth1"]
