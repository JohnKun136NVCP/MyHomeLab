# Laboratorio de seguridad (en la PC):  ./lab/security/lab.sh targets
# Máquinas vulnerables A PROPÓSITO. Viven en una red interna de Docker sin salida a
# internet ni a tu casa; solo las alcanzas desde la PC por 127.0.0.1 (a través de «gateway»)
# o desde el contenedor «attacker». No publiques estos puertos en la LAN.
name: homelab-seclab

networks:
  targets:
    internal: true          # sin salida: ni internet ni red de la casa
    ipam:
      config: [{ subnet: 10.250.66.0/24 }]   # lejos de 10.66.0.x (tu túnel) y de las redes de Docker
  egress:                   # solo para que «gateway» publique en 127.0.0.1

services:
  dvwa:
    image: vulnerables/web-dvwa
    networks: { targets: { ipv4_address: 10.250.66.10 } }
    restart: "no"

  juice-shop:
    image: bkimminich/juice-shop
    networks: { targets: { ipv4_address: 10.250.66.11 } }
    restart: "no"

  metasploitable:
    image: tleemcjr/metasploitable2
    command: sh -c "/bin/services.sh && tail -f /dev/null"
    networks: { targets: { ipv4_address: 10.250.66.12 } }
    restart: "no"
    profiles: ["metasploitable"]     # pesado: ./lab.sh targets --metasploitable

  # Tu máquina de ataque dentro de la misma red aislada:  ./lab/security/lab.sh attack
  attacker:
    image: kalilinux/kali-rolling
    command: sleep infinity
    hostname: attacker
    networks: { targets: { ipv4_address: 10.250.66.100 } }
    volumes: [./trabajo:/root/trabajo]
    restart: "no"

  # Las webs vulnerables, solo en la propia PC (http://127.0.0.1:8181 y :8182)
  gateway:
    image: nginx:alpine
    networks: [targets, egress]
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:8182:8182"
    volumes: [./gateway.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [dvwa, juice-shop]
    restart: "no"
